name: Build debug APK

on:
  push:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Print APK signing certificate fingerprint
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs -v app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-backup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        # Source stays private; app-releases is a small public repo (shared across projects) that
        # holds nothing but built binaries -- the in-app updater reads it with no credential at
        # all. RELEASES_TOKEN is a fine-grained PAT scoped only to app-releases (Contents:
        # read/write), stored as a secret here and used only by this CI job -- it never ships in
        # the app. Each app gets its own tag prefix and asset name so the shared repo can hold
        # releases for multiple projects without colliding; the updater filters for its own prefix
        # since /releases/latest would otherwise return whichever project published most recently.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="mediahub-${{ github.run_number }}"
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#mediahub.apk" \
            --repo "YahiaElghayesh/app-releases" \
            --title "MediaHub build ${{ github.run_number }}" \
            --notes "Automated MediaHub build from commit ${{ github.sha }} (yahiaelghayesh/backup, branch ${{ github.ref_name }}). The in-app updater checks this release."
